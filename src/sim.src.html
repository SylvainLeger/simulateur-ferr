<title>Simulateur FERR Québec</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : un questionnaire en cartes, puis un tableau de bord vertical (résumé, stratégies, flux animé, calculs, graphiques, tableau) */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e9ede9; --ink:#1b2420; --muted:#5a6762; --line:#d5dcd7;
  --accent:#0f6b5a; --accent-ink:#ffffff; --accent-soft:#dcece6;
  --ferr:#0f6b5a; --nr:#3d5a9e; --tfsa:#b7862a; --tax:#b24a22; --claw:#8c2f39; --spend:#7a8a83;
  --warn:#a4471c; --warn-soft:#f6e4da; --good:#2f7d4f;
  --display:"Source Serif 4", Georgia, serif; --body:"IBM Plex Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --sunk:#141b18; --ink:#e3eae6; --muted:#98a7a0; --line:#2d3934;
  --accent:#5cc4a9; --accent-ink:#0d1a16; --accent-soft:#1c332d;
  --ferr:#5cc4a9; --nr:#8ea8ec; --tfsa:#e2b75a; --tax:#ee8a60; --claw:#e07a86; --spend:#8c9a94;
  --warn:#f0a07a; --warn-soft:#38251d; --good:#76c895; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --sunk:#141b18; --ink:#e3eae6; --muted:#98a7a0; --line:#2d3934;
  --accent:#5cc4a9; --accent-ink:#0d1a16; --accent-soft:#1c332d;
  --ferr:#5cc4a9; --nr:#8ea8ec; --tfsa:#e2b75a; --tax:#ee8a60; --claw:#e07a86; --spend:#8c9a94;
  --warn:#f0a07a; --warn-soft:#38251d; --good:#76c895; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:650} h2{font-size:1.35rem;font-weight:650} h3{font-size:1.05rem;font-weight:650}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font:500 .72rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barre du haut */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.15rem}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}

/* questionnaire */
.wiz{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.rail{display:grid;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.rail button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:.9rem}
.rail button .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:500 .72rem var(--mono);flex:none;transition:all .3s}
.rail button.done .dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rail button.cur{color:var(--ink);background:var(--surface)}
.rail button.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;min-width:0}
.step{display:grid;gap:22px;animation:stepIn .45s cubic-bezier(.2,.8,.2,1)}
.step.back{animation-name:stepBack}
@keyframes stepIn{from{opacity:.0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.step h2{font-size:1.6rem}
.fields{display:grid;gap:20px}
.field{display:grid;gap:8px}
.field label{font-weight:500}
.field .hint{font-size:.83rem;color:var(--muted);max-width:60ch}
.numrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.numrow input[type=range]{flex:1 1 220px;min-width:0;accent-color:var(--accent)}
.numbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;flex:none}
.numbox input{width:120px;border:0;background:none;padding:8px 0;font:500 1rem var(--mono);color:var(--ink);text-align:right}
.numbox input:focus{outline:none}
.numbox:focus-within{border-color:var(--accent)}
.numbox span{color:var(--muted);font-family:var(--mono);padding-left:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{border:1.5px solid var(--line);border-radius:10px;padding:14px;text-align:left;background:var(--bg);display:grid;gap:4px;transition:border-color .2s,background .2s,transform .2s}
.choice:hover{transform:translateY(-1px)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice b{font-weight:600}
.choice span{font-size:.83rem;color:var(--muted)}
.insight{background:var(--sunk);border-radius:10px;padding:16px 18px;display:grid;gap:10px}
.insight .big{font:500 1.5rem var(--mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.wiz-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px}
.welcome{display:grid;gap:18px}
.welcome .lede{font-size:1.08rem;color:var(--muted);max-width:62ch}
.welcome ul{margin:0;padding-left:1.1em;display:grid;gap:6px;max-width:62ch}

/* jauge de revenu */
.gauge{position:relative;height:56px;margin-top:4px}
.gauge .track{position:absolute;left:0;right:0;top:22px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent-soft) 0 52%,var(--warn-soft) 52% 100%)}
.gauge .mark{position:absolute;top:14px;width:1px;height:26px;background:var(--muted)}
.gauge .mark span{position:absolute;top:28px;transform:translateX(-50%);font:400 .68rem var(--mono);color:var(--muted);white-space:nowrap}
.gauge .pin{position:absolute;top:10px;width:16px;height:34px;margin-left:-8px;transition:left .6s cubic-bezier(.2,.8,.2,1)}
.gauge .pin i{display:block;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent);margin-top:7px}

/* simulation */
.sim{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;min-width:0}
.headline{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:center}
.headline .big{font:500 clamp(2rem,5vw,3rem) var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.headline .delta{font:500 1rem var(--mono)}
.delta.pos{color:var(--good)} .delta.neg{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.tile .v{font:500 1.1rem var(--mono);font-variant-numeric:tabular-nums}
.tile .l{font-size:.78rem;color:var(--muted)}
.strats{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:.9rem;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stratctl{display:grid;gap:8px}
.ticks{position:relative;height:18px}
.ticks button{position:absolute;transform:translateX(-50%);border:0;background:none;font:400 .68rem var(--mono);color:var(--muted);padding:0;white-space:nowrap}
.ticks button:hover{color:var(--accent)}
.cmp{display:grid;gap:8px}
.cmp-row{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:2px 0}
.cmp-row .lbl{font-size:.88rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font:500 .65rem var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.cmp-track{height:28px;background:var(--sunk);border-radius:5px;position:relative;overflow:hidden}
.cmp-fill{height:100%;border-radius:5px;background:var(--spend);transition:width .8s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.cmp-fill span{font:500 .78rem var(--mono);color:#fff;white-space:nowrap}
.cmp-row.sel .cmp-fill{background:var(--accent)}
.cmp-row.sel .cmp-fill span{color:var(--accent-ink)}
.cmp-row.bad .cmp-fill{background:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.yearbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.yearbar input{flex:1 1 200px;min-width:0;accent-color:var(--accent)}
.yearlbl{font:500 1.05rem var(--mono);min-width:150px}
.flowwrap{overflow-x:auto}
.flow{width:100%;min-width:600px;height:auto;display:block}
.flow .node rect{fill:var(--sunk);stroke:var(--line)}
.flow .node text{fill:var(--ink);font-family:var(--body);font-size:13px}
.flow .node text.amt{font-family:var(--mono);font-size:14px;font-weight:500}
.flow .lnk{fill:none;stroke-linecap:round;opacity:.28;transition:stroke-width .6s}
.flow circle{opacity:.9}
.chain{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:c}
.chain li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline;counter-increment:c;animation:fadeUp .4s both}
.chain li::before{content:counter(c);font:500 .72rem var(--mono);color:var(--muted)}
.chain li .f{font-size:.82rem;color:var(--muted);grid-column:2/4}
.chain li .v{font:500 .95rem var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chain li.hl .v{color:var(--warn)}
.chain li.ok .v{color:var(--accent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dollar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.dollar div{transition:flex-grow .7s cubic-bezier(.2,.8,.2,1);min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .thr{stroke-width:1.6;stroke-dasharray:5 4}
.chart rect.b{transform-box:fill-box;transform-origin:50% 100%;cursor:pointer}
.chart.anim rect.b{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart rect.sel{stroke:var(--ink);stroke-width:1.5}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
th{font-family:var(--body);font-weight:600;color:var(--muted);font-size:.74rem;position:sticky;top:0;background:var(--surface)}
td:first-child,th:first-child{text-align:left}
tr.cur td{background:var(--accent-soft)}
tbody tr{cursor:pointer}
details summary{cursor:pointer;font-weight:600}
.adjust{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 26px}
.adjust .numbox input{width:100px}
.notes{font-size:.85rem;color:var(--muted);display:grid;gap:6px}
.notes ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.warnbox{background:var(--warn-soft);border-radius:8px;padding:10px 14px;font-size:.88rem}
[hidden]{display:none!important}
.btn:disabled{opacity:.6;cursor:progress}
.btn.danger{border-color:var(--warn);color:var(--warn)}
/* fenêtre scénarios et partage */
.dlg{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(720px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
.dlg::backdrop{background:rgb(10 16 14 / .45)}
.dlg-in{padding:22px;display:grid;gap:18px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dsec{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.scrow{display:flex;gap:8px;flex-wrap:wrap}
.scrow input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;font:inherit}
.scrow input[readonly]{font:400 .8rem var(--mono);color:var(--muted)}
.scform{display:grid;gap:6px}
.sclist{display:grid;gap:8px}
.scitem{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.scitem.cur{background:var(--sunk);border-style:dashed}
.scitem.act{border-color:var(--accent)}
.scmeta{display:grid;gap:2px;min-width:0}
.scmeta b{overflow-wrap:anywhere}
.scmeta .pill{justify-self:start}
.scbar{position:relative;height:24px;background:var(--sunk);border-radius:5px;overflow:hidden}
.scitem.cur .scbar{background:var(--surface)}
.scbar span{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);border-right:2px solid var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.scbar b{position:relative;display:block;padding:3px 8px;font-size:.8rem;font-weight:500}
.scbtns{display:flex;gap:6px;flex-wrap:wrap}
.scbtns .btn{padding:6px 10px;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){.wiz{grid-template-columns:1fr}.rail{position:static;grid-auto-flow:column;overflow-x:auto}.rail button span.t{display:none}.headline,.two{grid-template-columns:1fr}}
@media (max-width:620px){.scitem{grid-template-columns:1fr}}
@media (max-width:480px){.card{padding:18px}.dlg-in{padding:16px}.cmp-row{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.numbox input{width:96px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="16" width="6" height="12" rx="1.5" fill="var(--ferr)"/><rect x="12" y="9" width="6" height="19" rx="1.5" fill="var(--nr)"/><rect x="22" y="3" width="6" height="25" rx="1.5" fill="var(--tfsa)"/></svg>
      <b data-t="brand"></b>
    </div>
    <div class="top-actions">
      <button class="btn" id="editBtn" hidden data-t="edit"></button>
      <button class="btn" id="sessBtn" data-t="sess_btn"></button>
      <button class="btn primary" id="pdfBtn" data-t="pdf_btn"></button>
      <button class="btn" id="themeBtn" aria-label="Thème"></button>
      <div class="seg" role="group" aria-label="Langue / Language">
        <button id="lang-fr" aria-pressed="true">FR</button><button id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="wizard" class="wiz">
    <nav class="rail" id="rail" aria-label="Étapes"></nav>
    <div class="card" id="stepCard"></div>
  </main>

  <main id="sim" class="sim" hidden></main>
</div>
